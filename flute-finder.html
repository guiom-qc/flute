<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GuiOm̐ Flute Finder</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  margin:0;
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:16px;
  padding:20px;
  max-width:520px;
  margin:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
  font-size:22px;
  margin-top:0;
}

select,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  font-size:16px;
}

select{
  background:#0f172a;
  color:white;
  border:1px solid #334155;
}

button{
  background:#3b82f6;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.result{
  margin-top:20px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  padding:2px 7px;
  border-radius:999px;
  font-size:10px;
  margin-left:5px;
  color:#0f172a;
  font-weight:600;
}

.fit-good{
  background:#22c55e;
}

.fit-ok{
  background:#eab308;
}

.fit-hard{
  background:#ef4444;
}

.gold{
  background:#ca8a04;
}

.score{
  font-size:11px;
  opacity:.7;
  margin-left:4px;
}

.reason{
  font-size:12px;
  opacity:.8;
  margin-left:22px;
}

hr{
  border:0;
  border-top:1px solid #334155;
  margin:16px 0;
}
</style>
</head>

<body>

<div class="card">

<h1>🪈 GuiOm̐ Flute Finder</h1>

<label for="root">Note fondamentale</label>

<select id="root" onchange="analyze()">
  <option>C</option>
  <option>Db</option>
  <option>D</option>
  <option>Eb</option>
  <option>E</option>
  <option>F</option>
  <option>F#</option>
  <option>G</option>
  <option>Ab</option>
  <option>A</option>
  <option>Bb</option>
  <option>B</option>
</select>

<label for="mode">Mode</label>

<select id="mode" onchange="analyze()">
  <option value="major">Majeur</option>
  <option value="minor">Mineur</option>
</select>

<label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px">
  <input type="checkbox" id="nomade" onchange="toggleNomade()">
  Mode nomade
</label>

<div id="nomadeList"
     style="display:none;margin-top:10px;font-size:13px">
</div>

<button onclick="analyze()">Trouver les flûtes</button>

<div class="result" id="out"></div>

</div>

<script>

/* =========================================================
   INVENTAIRE RÉEL
   ========================================================= */

const flutes = [

  /* Whistles */
  {name:"Whistle C",  key:"C",  type:"Whistle"},
  {name:"Whistle A",  key:"A",  type:"Whistle"},
  {name:"Whistle D",  key:"D",  type:"Whistle"},
  {name:"Whistle Bb", key:"Bb", type:"Whistle"},

  /* Bansuris */
  {name:"Bansuri E",  key:"E",  type:"Bansuri"},
  {name:"Bansuri D",  key:"D",  type:"Bansuri"},
  {name:"Bansuri C",  key:"C",  type:"Bansuri"},
  {name:"Bansuri G",  key:"G",  type:"Bansuri"},
  {name:"Bansuri B",  key:"B",  type:"Bansuri"},
  {name:"Bansuri A",  key:"A",  type:"Bansuri"},
  {name:"Bansuri C#", key:"C#", type:"Bansuri"},
  {name:"Bansuri Bb", key:"Bb", type:"Bansuri"},
  {name:"Bansuri Eb", key:"Eb", type:"Bansuri"},

  /* Native American Flutes */
  {name:"NAF Gm",  key:"Gm",  type:"NAF"},
  {name:"NAF Am",  key:"Am",  type:"NAF"},
  {name:"NAF Dm",  key:"Dm",  type:"NAF"},
  {name:"NAF Em",  key:"Em",  type:"NAF"},
  {name:"NAF Ebm", key:"Ebm", type:"NAF"},
  {name:"NAF Fm",  key:"Fm",  type:"NAF"},
  {name:"NAF Bm",  key:"Bm",  type:"NAF"}
];


/* =========================================================
   FLÛTES POTENTIELLES À ACHETER
   ========================================================= */

const idealFlutes = [

  /* Bansuri */
  {type:"Bansuri", key:"C"},
  {type:"Bansuri", key:"Db"},
  {type:"Bansuri", key:"D"},
  {type:"Bansuri", key:"Eb"},
  {type:"Bansuri", key:"E"},
  {type:"Bansuri", key:"F"},
  {type:"Bansuri", key:"F#"},
  {type:"Bansuri", key:"G"},
  {type:"Bansuri", key:"Ab"},
  {type:"Bansuri", key:"A"},
  {type:"Bansuri", key:"Bb"},
  {type:"Bansuri", key:"B"},

  /* Whistle */
  {type:"Whistle", key:"C"},
  {type:"Whistle", key:"D"},
  {type:"Whistle", key:"Eb"},
  {type:"Whistle", key:"F"},
  {type:"Whistle", key:"G"},
  {type:"Whistle", key:"A"},
  {type:"Whistle", key:"Bb"},

  /* NAF */
  {type:"NAF", key:"Cm"},
  {type:"NAF", key:"Dm"},
  {type:"NAF", key:"Em"},
  {type:"NAF", key:"Fm"},
  {type:"NAF", key:"Gm"},
  {type:"NAF", key:"Am"},
  {type:"NAF", key:"Bm"},
  {type:"NAF", key:"Ebm"},
  {type:"NAF", key:"Abm"}
];


/* =========================================================
   NOTES
   ========================================================= */

const chromatic = [
  "C",
  "Db",
  "D",
  "Eb",
  "E",
  "F",
  "F#",
  "G",
  "Ab",
  "A",
  "Bb",
  "B"
];

const enharmonic = {
  "C#":"Db",
  "Gb":"F#",
  "Cb":"B",
  "E#":"F",
  "B#":"C",
  "Fb":"E"
};

function normalize(note){
  return enharmonic[note] || note;
}

function noteIndex(note){
  return chromatic.indexOf(normalize(note));
}

function transpose(root,semitones){

  const index = noteIndex(root);

  if(index === -1) return root;

  return chromatic[
    (index + semitones + 12) % 12
  ];
}


/* =========================================================
   GAMMES
   ========================================================= */

function majorScale(root){

  return [
    0,2,4,5,7,9,11
  ].map(
    n => transpose(root,n)
  );

}

function minorScale(root){

  return [
    0,2,3,5,7,8,10
  ].map(
    n => transpose(root,n)
  );

}


/* =========================================================
   RELATIVES
   ========================================================= */

function relativeMajor(minorRoot){

  return transpose(minorRoot,3);

}

function relativeMinor(majorRoot){

  return transpose(majorRoot,9);

}


/* =========================================================
   POSITION DE LA TONIQUE
   ========================================================= */

function tonicDegreeOnFlute(songRoot,fluteRoot){

  const distance =
    (
      noteIndex(songRoot) -
      noteIndex(fluteRoot) +
      12
    ) % 12;


  const degreeMap = {

    0:1,
    1:1.5,
    2:2,
    3:2.5,
    4:3,
    5:4,
    6:4.5,
    7:5,
    8:5.5,
    9:6,
    10:6.5,
    11:7

  };


  return degreeMap[distance];

}


/* =========================================================
   SCORE POSITION TONIQUE
   ========================================================= */

/*
   La position de la tonique reste le critère principal.

   Re = idéal
   Ga = excellent
   Ma = excellent
   Pa = très bon

   Mais Sa / Dha ne sont PAS éliminés :
   ils peuvent être très pertinents si la flûte
   possède une relation de gamme particulièrement
   intéressante.

   Maximum : 50 points.
*/

function positionScore(degree){

  const scores = {

    1:18,
    1.5:28,

    2:50,

    2.5:47,

    3:45,

    4:43,

    4.5:41,

    5:39,

    5.5:30,

    6:20,

    6.5:16,

    7:12

  };


  return scores[degree] ?? 15;

}


/* =========================================================
   CONFORT TONIQUE / TIERCE / QUINTE
   ========================================================= */

function importantNotesScore(
  songRoot,
  mode,
  fluteRoot
){

  const third =
    mode === "major"
      ? transpose(songRoot,4)
      : transpose(songRoot,3);


  const fifth =
    transpose(songRoot,7);


  const important = [

    {
      note:songRoot,
      weight:10
    },

    {
      note:third,
      weight:4
    },

    {
      note:fifth,
      weight:4
    }

  ];


  let weightedComfort = 0;
  let totalWeight = 0;


  important.forEach(item => {

    const degree =
      tonicDegreeOnFlute(
        item.note,
        fluteRoot
      );


    const distance =
      Math.abs(degree - 4);


    const comfort =
      Math.max(
        0,
        1 - distance / 4.5
      );


    weightedComfort +=
      comfort * item.weight;


    totalWeight +=
      item.weight;

  });


  return (
    weightedComfort /
    totalWeight
  ) * 25;

}


/* =========================================================
   COMPATIBILITÉ DE GAMME
   ========================================================= */

function scaleCompatibility(
  songRoot,
  mode,
  fluteRoot
){

  const songScale =
    mode === "major"
      ? majorScale(songRoot)
      : minorScale(songRoot);


  const fluteScale =
    majorScale(fluteRoot);


  let matches = 0;


  songScale.forEach(note => {

    if(fluteScale.includes(note)){
      matches++;
    }

  });


  /*
     Seulement 15 points maximum.

     La compatibilité de gamme est importante,
     mais ne doit jamais écraser le confort de jeu.
  */

  return {

    matches,

    total:songScale.length,

    score:
      (matches /
       songScale.length) * 15

  };

}


/* =========================================================
   RELATIONS MUSICALES
   ========================================================= */

function relationshipScore(
  fluteRoot,
  songRoot,
  mode
){

  let score = 0;

  let reasons = [];


  const normalizedFlute =
    normalize(fluteRoot);

  const normalizedSong =
    normalize(songRoot);


  /* =======================================================
     MÊME FONDAMENTALE
     ======================================================= */

  if(
    normalizedFlute ===
    normalizedSong
  ){

    score += 4;

    reasons.push(
      "même fondamentale"
    );

  }


  /* =======================================================
     RELATIVE MAJEURE
     ======================================================= */

  if(mode === "minor"){

    const relMajor =
      relativeMajor(songRoot);


    if(
      normalizedFlute ===
      normalize(relMajor)
    ){

      /*
         TRÈS IMPORTANT :

         Cm → Eb
         Am → C
         Em → G

         Une Bansuri dans la relative majeure
         est une véritable option de premier plan.

         On lui donne maintenant un GROS bonus.
      */

      score += 25;

      reasons.push(
        "relative majeure ⭐"
      );

    }

  }


  /* =======================================================
     RELATIVE MINEURE
     ======================================================= */

  if(mode === "major"){

    const relMinor =
      relativeMinor(songRoot);


    if(
      normalizedFlute ===
      normalize(relMinor)
    ){

      score += 8;

      reasons.push(
        "relative mineure"
      );

    }

  }


  /* =======================================================
     QUINTE
     ======================================================= */

  const fifth =
    transpose(songRoot,7);


  if(
    normalizedFlute ===
    normalize(fifth)
  ){

    score += 3;

    reasons.push(
      "quinte"
    );

  }


  return {

    score:
      Math.min(30,score),

    reasons

  };

}


/* =========================================================
   SCORE BANSURI / WHISTLE
   ========================================================= */

function scoreMelodicFlute(
  flute,
  songRoot,
  mode
){

  const fluteRoot =
    normalize(flute.key);


  let score = 0;

  let reasons = [];


  /* -------------------------------------------------------
     1. POSITION DE LA TONIQUE
     ------------------------------------------------------- */

  const tonicDegree =
    tonicDegreeOnFlute(
      songRoot,
      fluteRoot
    );


  score +=
    positionScore(
      tonicDegree
    );


  /* Explication */

  if(tonicDegree === 2){

    reasons.push(
      "tonique = Re ⭐"
    );

  }

  else if(tonicDegree === 3){

    reasons.push(
      "tonique = Ga"
    );

  }

  else if(tonicDegree === 4){

    reasons.push(
      "tonique = Ma"
    );

  }

  else if(tonicDegree === 5){

    reasons.push(
      "tonique = Pa"
    );

  }

  else if(tonicDegree >= 6){

    reasons.push(
      "tonique plutôt aiguë"
    );

  }

  else if(tonicDegree <= 1.5){

    reasons.push(
      "tonique plutôt grave"
    );

  }


  /* -------------------------------------------------------
     2. TONIQUE / TIERCE / QUINTE
     ------------------------------------------------------- */

  score +=
    importantNotesScore(
      songRoot,
      mode,
      fluteRoot
    );


  /* -------------------------------------------------------
     3. COMPATIBILITÉ DE GAMME
     ------------------------------------------------------- */

  const compatibility =
    scaleCompatibility(
      songRoot,
      mode,
      fluteRoot
    );


  score +=
    compatibility.score;


  reasons.push(
    `${compatibility.matches}/${compatibility.total} notes naturelles`
  );


  /* -------------------------------------------------------
     4. RELATIONS
     ------------------------------------------------------- */

  const relations =
    relationshipScore(
      fluteRoot,
      songRoot,
      mode
    );


  score +=
    relations.score;


  reasons =
    reasons.concat(
      relations.reasons
    );


  /* -------------------------------------------------------
     5. BONUS BANSURI
     ------------------------------------------------------- */

  if(flute.type === "Bansuri"){

    score += 3;

  }


  return {

    score:
      Math.min(
        100,
        Math.round(score)
      ),

    reasons

  };

}


/* =========================================================
   SCORE NAF
   ========================================================= */

function scoreNAF(
  flute,
  songRoot,
  mode
){

  const fluteRoot =
    normalize(
      flute.key.replace("m","")
    );


  let score = 0;

  let reasons = [];


  /* =======================================================
     NAF EXACTE EN MINEUR
     ======================================================= */

  if(
    mode === "minor" &&
    fluteRoot ===
    normalize(songRoot)
  ){

    return {

      score:100,

      reasons:[
        "tonalité mineure exacte"
      ]

    };

  }


  /* =======================================================
     NAF SUR MÊME FONDAMENTALE EN MAJEUR
     ======================================================= */

  if(
    mode === "major" &&
    fluteRoot ===
    normalize(songRoot)
  ){

    score += 60;

    reasons.push(
      "même fondamentale"
    );

  }


  /* =======================================================
     RELATIVE
     ======================================================= */

  const relMajor =
    relativeMajor(songRoot);


  if(
    fluteRoot ===
    normalize(relMajor)
  ){

    score += 45;

    reasons.push(
      "relative majeure"
    );

  }


  return {

    score:
      Math.min(
        100,
        Math.round(score)
      ),

    reasons

  };

}


/* =========================================================
   SCORE GLOBAL
   ========================================================= */

function scoreFlute(
  flute,
  songRoot,
  mode
){

  if(flute.type === "NAF"){

    return scoreNAF(
      flute,
      songRoot,
      mode
    );

  }


  return scoreMelodicFlute(
    flute,
    songRoot,
    mode
  );

}


/* =========================================================
   LABEL
   ========================================================= */

function scoreLabel(score){

  if(score >= 85){

    return {
      text:"excellent",
      className:"fit-good"
    };

  }


  if(score >= 70){

    return {
      text:"très bon",
      className:"fit-good"
    };

  }


  if(score >= 55){

    return {
      text:"bon",
      className:"fit-ok"
    };

  }


  return {
    text:"moins adapté",
    className:"fit-hard"
  };

}


/* =========================================================
   MÊME TONALITÉ
   ========================================================= */

function sameKey(a,b){

  return normalize(a) ===
         normalize(b);

}


/* =========================================================
   SUGGESTION D'ACHAT
   ========================================================= */

function findIdealPurchase(
  root,
  mode,
  activeFlutes
){

  let candidates = [];


  if(mode === "major"){

    candidates =
      idealFlutes.filter(
        f =>
          f.type !== "NAF" &&
          sameKey(
            f.key,
            root
          )
      );

  }

  else{

    const rel =
      relativeMajor(root);


    candidates =
      idealFlutes.filter(f =>

        (
          f.type === "NAF" &&
          sameKey(
            f.key,
            root + "m"
          )
        )

        ||

        (
          f.type === "Bansuri" &&
          sameKey(
            f.key,
            rel
          )
        )

      );

  }


  candidates =
    candidates.filter(
      candidate =>

        !activeFlutes.some(
          owned =>

            owned.type ===
              candidate.type &&

            sameKey(
              owned.key,
              candidate.key
            )

        )

    );


  if(!candidates.length){

    return null;

  }


  return candidates[0];

}


/* =========================================================
   AFFICHAGE
   ========================================================= */

function row(f,i){

  const medal =
    i === 0
      ? "🥇"
      : i === 1
        ? "🥈"
        : i === 2
          ? "🥉"
          : "";


  const label =
    scoreLabel(
      f.score
    );


  return `

    <div style="margin:9px 0">

      • ${f.name}

      <span class="badge">
        ${medal}
      </span>

      <span class="badge ${label.className}">
        ${label.text}
      </span>

      <span class="score">
        ${f.score}/100
      </span>

      <div class="reason">
        ${f.reasons.join(" • ")}
      </div>

    </div>

  `;

}


/* =========================================================
   ANALYSE
   ========================================================= */

function analyze(){

  const root =
    document.getElementById(
      "root"
    ).value;


  const mode =
    document.getElementById(
      "mode"
    ).value;


  const activeFlutes =
    getActiveFlutes();


  let scored =
    activeFlutes.map(
      flute => {

        const result =
          scoreFlute(
            flute,
            root,
            mode
          );


        return {
          ...flute,
          ...result
        };

      }
    );


  scored.sort(
    (a,b) => {

      if(
        b.score !==
        a.score
      ){

        return (
          b.score -
          a.score
        );

      }


      return a.name.localeCompare(
        b.name
      );

    }
  );


  const best =
    scored.slice(0,5);


  const idealPurchase =
    findIdealPurchase(
      root,
      mode,
      activeFlutes
    );


  const relative =
    mode === "minor"
      ? relativeMajor(root)
      : relativeMinor(root);


  let html = `

    <div>
      <b>Tonalité :</b>
      ${root}${mode === "minor" ? "m" : ""}
    </div>

    <div>
      <b>Relative :</b>
      ${relative}
    </div>

    <hr>

    <div>
      <b>🪈 Meilleurs choix</b>
    </div>

  `;


  if(best.length){

    html +=
      best
        .map(
          (f,i) =>
            row(f,i)
        )
        .join("");

  }

  else{

    html +=
      "<div>Aucune flûte sélectionnée.</div>";

  }


  /* -------------------------------------------------------
     ACHAT
     ------------------------------------------------------- */

  if(idealPurchase){

    html += `

      <hr>

      <div
        style="
          font-size:13px;
          opacity:.9
        "
      >

        <b>💡 Achat intéressant</b><br>

        • ${idealPurchase.type}
        en ${idealPurchase.key}

        <span class="badge gold">
          complément idéal
        </span>

      </div>

    `;

  }


  document.getElementById(
    "out"
  ).innerHTML = html;

}


/* =========================================================
   MODE NOMADE
   ========================================================= */

function toggleNomade(){

  const checked =
    document.getElementById(
      "nomade"
    ).checked;


  const list =
    document.getElementById(
      "nomadeList"
    );


  if(checked){

    list.style.display =
      "block";

    renderNomadeList();

  }

  else{

    list.style.display =
      "none";

  }

}


/* =========================================================
   LISTE NOMADE
   ========================================================= */

function renderNomadeList(){

  const list =
    document.getElementById(
      "nomadeList"
    );


  const defaultSelected = [

    "Bansuri C",
    "Bansuri D",
    "Bansuri G",
    "Bansuri B",
    "Bansuri A",
    "Bansuri Bb",
    "Bansuri Eb",

    "Whistle C",
    "Whistle D",

    "NAF Dm",
    "NAF Gm",
    "NAF Bm"

  ];


  const saved =
    JSON.parse(
      localStorage.getItem(
        "nomadeFlutes"
      ) || "null"
    );


  const selectedSet =
    saved ||
    defaultSelected;


  list.innerHTML =
    flutes.map(
      f => `

        <label
          style="
            display:block;
            margin:4px 0
          "
        >

          <input
            type="checkbox"
            class="fluteCheck"
            value="${f.name}"
            ${
              selectedSet.includes(
                f.name
              )
                ? "checked"
                : ""
            }
            onchange="
              saveNomadeSelection()
            "
          >

          ${f.name}

        </label>

      `
    ).join("");

}


/* =========================================================
   FLÛTES ACTIVES
   ========================================================= */

function getActiveFlutes(){

  const nomade =
    document.getElementById(
      "nomade"
    ).checked;


  if(!nomade){

    return flutes;

  }


  const checked =
    [
      ...document.querySelectorAll(
        ".fluteCheck:checked"
      )
    ].map(
      el => el.value
    );


  return flutes.filter(
    flute =>
      checked.includes(
        flute.name
      )
  );

}


/* =========================================================
   SAUVEGARDE
   ========================================================= */

function saveNomadeSelection(){

  const selected =
    [
      ...document.querySelectorAll(
        ".fluteCheck:checked"
      )
    ].map(
      el => el.value
    );


  localStorage.setItem(
    "nomadeFlutes",
    JSON.stringify(
      selected
    )
  );

}


/* =========================================================
   INITIALISATION
   ========================================================= */

analyze();

</script>

</body>
</html>
