<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GuiOm̐ Flute Finder</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  margin:0;
  padding:20px
}

.card{
  background:#1e293b;
  border-radius:16px;
  padding:20px;
  max-width:520px;
  margin:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.3)
}

h1{
  font-size:22px;
  margin-top:0
}

select,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:12px;
  border:none;
  font-size:16px
}

select{
  background:#0f172a;
  color:white;
  border:1px solid #334155
}

button{
  background:#3b82f6;
  color:white;
  font-weight:600;
  cursor:pointer
}

.result{
  margin-top:20px;
  line-height:1.6
}

.badge{
  display:inline-block;
  padding:2px 7px;
  border-radius:999px;
  font-size:10px;
  margin-left:5px;
  color:#0f172a;
  font-weight:600
}

.fit-good{background:#22c55e}
.fit-ok{background:#eab308}
.fit-hard{background:#ef4444}

.gold{background:#ca8a04}
.silver{background:#64748b}
.bronze{background:#92400e}

.score{
  font-size:11px;
  opacity:.7;
  margin-left:4px
}

.reason{
  font-size:12px;
  opacity:.8;
  margin-left:22px
}

hr{
  border:0;
  border-top:1px solid #334155;
  margin:16px 0
}
</style>
</head>

<body>

<div class="card">

<h1>🪈 GuiOm̐ Flute Finder</h1>

<label for="root">Note fondamentale</label>

<select id="root" onchange="analyze()">
  <option>C</option>
  <option>Db</option>
  <option>D</option>
  <option>Eb</option>
  <option>E</option>
  <option>F</option>
  <option>F#</option>
  <option>G</option>
  <option>Ab</option>
  <option>A</option>
  <option>Bb</option>
  <option>B</option>
</select>

<label for="mode">Mode</label>

<select id="mode" onchange="analyze()">
  <option value="major">Majeur</option>
  <option value="minor">Mineur</option>
</select>

<label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px">
  <input type="checkbox" id="nomade" onchange="toggleNomade()">
  Mode nomade
</label>

<div id="nomadeList"
     style="display:none;margin-top:10px;font-size:13px">
</div>

<button onclick="analyze()">Trouver les flûtes</button>

<div class="result" id="out"></div>

</div>

<script>

/* =========================================================
   INVENTAIRE
   ========================================================= */

const flutes = [

  /* Whistles */
  {name:"Whistle C",  key:"C",  type:"Whistle"},
  {name:"Whistle A",  key:"A",  type:"Whistle"},
  {name:"Whistle D",  key:"D",  type:"Whistle"},
  {name:"Whistle Bb", key:"Bb", type:"Whistle"},

  /* Bansuris */
  {name:"Bansuri E",  key:"E",  type:"Bansuri"},
  {name:"Bansuri D",  key:"D",  type:"Bansuri"},
  {name:"Bansuri C",  key:"C",  type:"Bansuri"},
  {name:"Bansuri G",  key:"G",  type:"Bansuri"},
  {name:"Bansuri B",  key:"B",  type:"Bansuri"},
  {name:"Bansuri A",  key:"A",  type:"Bansuri"},
  {name:"Bansuri C#", key:"C#", type:"Bansuri"},
  {name:"Bansuri Bb", key:"Bb", type:"Bansuri"},
  {name:"Bansuri Eb", key:"Eb", type:"Bansuri"},

  /* Native American Flutes */
  {name:"NAF Gm",  key:"Gm",  type:"NAF"},
  {name:"NAF Am",  key:"Am",  type:"NAF"},
  {name:"NAF Dm",  key:"Dm",  type:"NAF"},
  {name:"NAF Em",  key:"Em",  type:"NAF"},
  {name:"NAF Ebm", key:"Ebm", type:"NAF"},
  {name:"NAF Fm",  key:"Fm",  type:"NAF"},
  {name:"NAF Bm",  key:"Bm",  type:"NAF"}
];


/* =========================================================
   FLÛTES POSSIBLES À ACHETER
   ========================================================= */

const idealFlutes = [

  {type:"Bansuri", key:"C"},
  {type:"Bansuri", key:"Db"},
  {type:"Bansuri", key:"D"},
  {type:"Bansuri", key:"Eb"},
  {type:"Bansuri", key:"E"},
  {type:"Bansuri", key:"F"},
  {type:"Bansuri", key:"F#"},
  {type:"Bansuri", key:"G"},
  {type:"Bansuri", key:"Ab"},
  {type:"Bansuri", key:"A"},
  {type:"Bansuri", key:"Bb"},
  {type:"Bansuri", key:"B"},

  {type:"Whistle", key:"C"},
  {type:"Whistle", key:"D"},
  {type:"Whistle", key:"Eb"},
  {type:"Whistle", key:"F"},
  {type:"Whistle", key:"G"},
  {type:"Whistle", key:"A"},
  {type:"Whistle", key:"Bb"},

  {type:"NAF", key:"Cm"},
  {type:"NAF", key:"Dm"},
  {type:"NAF", key:"Em"},
  {type:"NAF", key:"Fm"},
  {type:"NAF", key:"Gm"},
  {type:"NAF", key:"Am"},
  {type:"NAF", key:"Bm"},
  {type:"NAF", key:"Ebm"},
  {type:"NAF", key:"Abm"}
];


/* =========================================================
   NOTES / ENHARMONIQUES
   ========================================================= */

const chromatic = [
  "C","Db","D","Eb","E","F",
  "F#","G","Ab","A","Bb","B"
];

const enharmonic = {
  "C#":"Db",
  "Gb":"F#",
  "Cb":"B",
  "E#":"F",
  "B#":"C",
  "Fb":"E"
};

function normalize(n){
  return enharmonic[n] || n;
}

function noteIndex(n){
  return chromatic.indexOf(normalize(n));
}

function transpose(root, semitones){

  const i = noteIndex(root);

  if(i === -1) return root;

  return chromatic[(i + semitones + 12) % 12];
}


/* =========================================================
   GAMMES
   ========================================================= */

/*
   Majeur :
   0 2 4 5 7 9 11

   Mineur naturel :
   0 2 3 5 7 8 10
*/

function majorScale(root){

  return [0,2,4,5,7,9,11]
    .map(n => transpose(root,n));

}

function minorScale(root){

  return [0,2,3,5,7,8,10]
    .map(n => transpose(root,n));

}


/* =========================================================
   TONALITÉ DE LA FLÛTE
   ========================================================= */

/*
   Bansuri et Whistle :
   on considère une gamme majeure naturelle.

   NAF :
   on considère une gamme mineure naturelle.
*/

function fluteScale(flute){

  const root =
    normalize(flute.key.replace("m",""));

  if(flute.type === "NAF"){

    return minorScale(root);

  }

  return majorScale(root);

}


/* =========================================================
   RELATIVE
   ========================================================= */

function relativeMajor(minorRoot){

  return transpose(minorRoot,3);

}

function relativeMinor(majorRoot){

  return transpose(majorRoot,9);

}


/* =========================================================
   SCORE MUSICAL
   ========================================================= */

function scoreFlute(flute, root, mode){

  const songScale =
    mode === "major"
      ? majorScale(root)
      : minorScale(root);

  const instrumentScale =
    fluteScale(flute);


  let matchingNotes = 0;

  songScale.forEach(note => {

    if(instrumentScale.includes(note)){
      matchingNotes++;
    }

  });


  /*
     Pour une gamme à 7 notes :

     7/7 = toutes les notes disponibles
     6/7 = excellent
     5/7 = bon
     4/7 = moyen
     <4 = difficile
  */

  const coverage =
    matchingNotes / songScale.length;


  let score =
    coverage * 70;


  let reasons = [];


  const fluteRoot =
    normalize(flute.key.replace("m",""));


  /* =======================================================
     CORRESPONDANCE PARFAITE
     ======================================================= */

  if(mode === "major"){

    if(flute.type !== "NAF" &&
       fluteRoot === normalize(root)){

      score += 30;

      reasons.push("tonique");

    }

  }


  if(mode === "minor"){

    /*
       NAF dans la tonalité mineure exacte
    */

    if(flute.type === "NAF" &&
       fluteRoot === normalize(root)){

      score += 30;

      reasons.push("tonalité mineure exacte");

    }


    /*
       Bansuri / Whistle dans la relative majeure.

       Exemple :
       Cm → Eb
       Am → C
       Em → G

       C'est une correspondance 7/7.
    */

    const relMajor =
      relativeMajor(root);

    if(flute.type !== "NAF" &&
       fluteRoot === relMajor){

      score += 30;

      reasons.push("relative majeure");

    }

  }


  /* =======================================================
     TONIQUE DE LA FLÛTE
     ======================================================= */

  if(fluteRoot === normalize(root)){

    reasons.push("fondamentale");

  }


  /* =======================================================
     TYPE DE FLÛTE
     ======================================================= */

  /*
     Léger avantage à la Bansuri pour l'improvisation
     mélodique, sans écraser les autres possibilités.
  */

  if(flute.type === "Bansuri"){

    score += 2;

  }


  /*
     La NAF correspondant exactement au mineur
     reste une option extrêmement forte.
  */

  if(flute.type === "NAF" &&
     mode === "minor" &&
     fluteRoot === normalize(root)){

    score += 3;

  }


  /* =======================================================
     LIMITE
     ======================================================= */

  score =
    Math.min(100,Math.round(score));


  return {
    score,
    matchingNotes,
    totalNotes:songScale.length,
    reasons
  };

}


/* =========================================================
   LABEL DU SCORE
   ========================================================= */

function scoreLabel(score){

  if(score >= 95){

    return {
      text:"excellent",
      className:"fit-good"
    };

  }

  if(score >= 80){

    return {
      text:"très bon",
      className:"fit-good"
    };

  }

  if(score >= 65){

    return {
      text:"bon",
      className:"fit-ok"
    };

  }

  return {
    text:"difficile",
    className:"fit-hard"
  };

}


/* =========================================================
   INVENTAIRE / ACHAT
   ========================================================= */

function sameKey(a,b){

  return normalize(a) === normalize(b);

}


function findIdealPurchase(root, mode, activeFlutes){

  let candidates;


  if(mode === "major"){

    candidates =
      idealFlutes.filter(
        f =>
          f.type !== "NAF" &&
          sameKey(f.key,root)
      );

  }

  else{

    /*
       Pour une tonalité mineure, deux achats peuvent
       être particulièrement intéressants :

       1. NAF dans la tonalité mineure
       2. Bansuri dans la relative majeure
    */

    const relative =
      relativeMajor(root);


    candidates =
      idealFlutes.filter(f =>

        (
          f.type === "NAF" &&
          sameKey(f.key,root + "m")
        )

        ||

        (
          f.type === "Bansuri" &&
          sameKey(f.key,relative)
        )

      );

  }


  /*
     Retirer ce qui est déjà possédé.
  */

  candidates =
    candidates.filter(
      candidate =>
        !activeFlutes.some(
          owned =>
            owned.type === candidate.type &&
            sameKey(owned.key,candidate.key)
        )
    );


  if(!candidates.length){

    return null;

  }


  return candidates[0];

}


/* =========================================================
   ANALYSE
   ========================================================= */

function analyze(){

  const root =
    document.getElementById("root").value;

  const mode =
    document.getElementById("mode").value;


  const activeFlutes =
    getActiveFlutes();


  let scored =
    activeFlutes.map(flute => {

      const result =
        scoreFlute(flute,root,mode);

      return {
        ...flute,
        ...result
      };

    });


  /*
     Tri :
     1. score musical
     2. nombre de notes compatibles
     3. nom
  */

  scored.sort((a,b) => {

    if(b.score !== a.score){

      return b.score - a.score;

    }

    if(b.matchingNotes !== a.matchingNotes){

      return b.matchingNotes - a.matchingNotes;

    }

    return a.name.localeCompare(b.name);

  });


  const best =
    scored.slice(0,5);


  const idealPurchase =
    findIdealPurchase(
      root,
      mode,
      activeFlutes
    );


  const relative =
    mode === "major"
      ? relativeMinor(root)
      : relativeMajor(root);


  let html = `

    <div>
      <b>Tonalité :</b>
      ${root}${mode === "minor" ? "m" : ""}
    </div>

    <div>
      <b>Relative :</b>
      ${relative}${mode === "minor" ? "" : "m"}
    </div>

    <hr>

    <div>
      <b>🪈 Meilleurs choix</b>
    </div>

  `;


  if(best.length){

    html += best
      .map((f,i) => row(f,i))
      .join("");

  }

  else{

    html +=
      "<div>Aucune flûte sélectionnée.</div>";

  }


  /*
     Suggestion d'achat
  */

  if(idealPurchase){

    html += `

      <hr>

      <div style="font-size:13px;opacity:.9">

        <b>💡 Achat intéressant</b><br>

        • ${idealPurchase.type} en ${idealPurchase.key}

        <span class="badge gold">
          complément idéal
        </span>

      </div>

    `;

  }


  document.getElementById("out").innerHTML =
    html;

}


/* =========================================================
   AFFICHAGE
   ========================================================= */

function row(f,i){

  const medal =
    i === 0
      ? "🥇"
      : i === 1
        ? "🥈"
        : i === 2
          ? "🥉"
          : "";


  const label =
    scoreLabel(f.score);


  const reasons =
    f.reasons.length
      ? f.reasons.join(" • ")
      : `${f.matchingNotes}/${f.totalNotes} notes de la gamme`;


  return `

    <div style="margin:8px 0">

      • ${f.name}

      <span class="badge">
        ${medal}
      </span>

      <span class="badge ${label.className}">
        ${label.text}
      </span>

      <span class="score">
        ${f.score}/100
      </span>

      <div class="reason">
        ${reasons}
      </div>

    </div>

  `;

}


/* =========================================================
   MODE NOMADE
   ========================================================= */

function toggleNomade(){

  const checked =
    document.getElementById("nomade").checked;

  const list =
    document.getElementById("nomadeList");


  if(checked){

    list.style.display = "block";

    renderNomadeList();

  }

  else{

    list.style.display = "none";

  }

}


/* =========================================================
   LISTE NOMADE
   ========================================================= */

function renderNomadeList(){

  const list =
    document.getElementById("nomadeList");


  const defaultSelected = [

    "Bansuri C",
    "Bansuri D",
    "Bansuri G",
    "Bansuri B",
    "Bansuri A",
    "Bansuri Bb",
    "Bansuri Eb",

    "Whistle C",
    "Whistle D",

    "NAF Dm",
    "NAF Gm",
    "NAF Bm"

  ];


  const saved =
    JSON.parse(
      localStorage.getItem("nomadeFlutes") || "null"
    );


  const selectedSet =
    saved || defaultSelected;


  list.innerHTML =
    flutes.map(f => `

      <label
        style="display:block;margin:4px 0"
      >

        <input
          type="checkbox"
          class="fluteCheck"
          value="${f.name}"
          ${
            selectedSet.includes(f.name)
              ? "checked"
              : ""
          }
          onchange="saveNomadeSelection()"
        >

        ${f.name}

      </label>

    `).join("");

}


/* =========================================================
   FLÛTES ACTIVES
   ========================================================= */

function getActiveFlutes(){

  const nomade =
    document.getElementById("nomade").checked;


  if(!nomade){

    return flutes;

  }


  const checked =
    [
      ...document.querySelectorAll(
        ".fluteCheck:checked"
      )
    ].map(
      el => el.value
    );


  return flutes.filter(
    flute =>
      checked.includes(flute.name)
  );

}


/* =========================================================
   SAUVEGARDE
   ========================================================= */

function saveNomadeSelection(){

  const selected =
    [
      ...document.querySelectorAll(
        ".fluteCheck:checked"
      )
    ].map(
      el => el.value
    );


  localStorage.setItem(
    "nomadeFlutes",
    JSON.stringify(selected)
  );

}


/* =========================================================
   INITIALISATION
   ========================================================= */

analyze();

</script>

</body>
</html>
